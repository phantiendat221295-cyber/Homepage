<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="badge-shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>
  <!-- Khung nền bo góc trắng tạo độ tương phản hoàn hảo trên cả tab sáng và tab tối -->
  <rect x="14" y="14" width="484" height="484" rx="112" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="10" filter="url(#badge-shadow)"/>
  
  <!-- 3 chữ F P T đậm nét, rõ nét chuẩn màu nhận diện FPT -->
  <text x="256" y="328" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Liberation Sans', Arial, sans-serif" font-weight="900" font-size="210" text-anchor="middle" letter-spacing="-2">
    <tspan fill="#08509F">F</tspan><tspan fill="#F27123">P</tspan><tspan fill="#51B748">T</tspan>
  </text>
</svg>
